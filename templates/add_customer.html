{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5 mb-5">
    <h1 class="text-center text-white bg-dark p-3 rounded">Register a New Customer</h1>

    <form method="post" class="mt-4">
        {% csrf_token %}

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input name="name" type="text" class="form-control" id="name" placeholder="First and last name" required>
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input name="email" type="email" class="form-control" id="email" placeholder="Email address" required>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <input name="phone" type="tel" class="form-control" id="phone" placeholder="Phone number" required>
            </div>
            <div class="col-md-2">
                <label for="sex" class="form-label">Sex</label>
                <select name="sex" id="sex" class="form-select" required>
                    <option value="">Choose gender...</option>
                    <option value="M">Male</option>
                    <option value="F">Female</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="age" class="form-label">Age</label>
                <select name="age" id="age" class="form-select" required>
                    <option value="">Choose age range...</option>
                    <option value="0-15">0-15</option>
                    <option value="15-25">15-25</option>
                    <option value="25-40">25-40</option>
                    <option value="40+">40+</option>
                </select>
            </div>
        </div>

        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input name="address" type="text" class="form-control" id="address" placeholder="Customer address" required>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="city" class="form-label">City</label>
                <input name="city" type="text" class="form-control" id="city" placeholder="City" required>
            </div>
            <div class="col-md-6">
                <label for="zip" class="form-label">Zip Code</label>
                <input name="zip" type="text" class="form-control" id="zip" placeholder="Zip code" required>
            </div>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg">Save Customer</button>
        </div>
    </form>
</div>
{% endblock %}
